<body>

<a class="salta" href="#main">Vai al contenuto</a>

<header class="top" id="top">
  <a class="marchio" href="#adesso" aria-label="Maladh, torna all’inizio">
    <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
      <g fill="currentColor">
        <circle cx="16" cy="5" r="1.7"/><circle cx="22.2" cy="7.5" r="1.7"/><circle cx="24.8" cy="13.4" r="1.7"/>
        <circle cx="23.2" cy="19.6" r="1.7"/><circle cx="19.4" cy="24" r="1.7"/>
        <circle cx="12.6" cy="24" r="1.7"/><circle cx="8.8" cy="19.6" r="1.7"/><circle cx="7.2" cy="13.4" r="1.7"/>
        <circle cx="9.8" cy="7.5" r="1.7"/>
        <circle cx="16" cy="27.2" r="3.1"/>
      </g>
    </svg>
    <span>Maladh</span>
  </a>
  <button class="bottone-i" id="btn-info" type="button" aria-label="Su Maladh" aria-haspopup="dialog">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 11v5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="7.9" r="1.15" fill="currentColor"/></svg>
  </button>
</header>

<main id="main" tabindex="-1">
  <section class="vista" id="v-adesso" aria-label="Adesso" hidden></section>
  <section class="vista" id="v-tasbih" aria-label="Tasbih" hidden></section>
  <section class="vista" id="v-adhkar" aria-label="Adhkar" hidden></section>
  <section class="vista" id="v-awrad" aria-label="Awrad" hidden></section>
  <section class="vista" id="v-santuario" aria-label="Santuario interiore" hidden></section>
</main>

<!-- Lettore delle registrazioni: compare solo quando si ascolta qualcosa -->
<div class="lettore" id="lettore" role="group" aria-label="Lettore audio" hidden>
  <button class="lt-play" id="lt-play" type="button" aria-label="Pausa">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path id="lt-icona" d="M7 5h3.4v14H7zM13.6 5H17v14h-3.4z" fill="currentColor"/></svg>
  </button>
  <div class="lt-centro">
    <div class="lt-titolo" id="lt-titolo"></div>
    <input class="lt-pos" id="lt-pos" type="range" min="0" max="1000" step="1" value="0" aria-label="Posizione nella traccia">
    <div class="lt-tempo" id="lt-tempo" aria-hidden="true">0:00 / 0:00</div>
  </div>
  <button class="lt-chiudi" id="lt-chiudi" type="button" aria-label="Chiudi il lettore">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
  </button>
</div>

<nav class="barra" id="barra" aria-label="Sezioni">
  <a href="#adesso" data-vista="adesso">
    <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    <span>Adesso</span>
  </a>
  <a href="#tasbih" data-vista="tasbih">
    <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="4.2" r="1.5"/><circle cx="17.7" cy="6.5" r="1.5"/><circle cx="19.8" cy="12" r="1.5"/><circle cx="17.7" cy="17.5" r="1.5"/><circle cx="6.3" cy="17.5" r="1.5"/><circle cx="4.2" cy="12" r="1.5"/><circle cx="6.3" cy="6.5" r="1.5"/><circle cx="12" cy="20" r="2.2"/></g></svg>
    <span>Tasbih</span>
  </a>
  <a href="#adhkar" data-vista="adhkar">
    <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 6.5C10 5 7 4.6 4 5v13c3-.4 6 0 8 1.5M12 6.5C14 5 17 4.6 20 5v13c-3-.4-6 0-8 1.5M12 6.5v13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Adhkar</span>
  </a>
  <a href="#awrad" data-vista="awrad">
    <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M4 20V11a8 8 0 0 1 16 0v9M8 20v-8.4a4 4 0 0 1 8 0V20M4 20h16M12 3V1.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Awrad</span>
  </a>
</nav>

<!-- Finestra «Su Maladh» -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="sheet-card" id="sheet-card" tabindex="-1">
    <h2 id="sheet-title">Su Maladh</h2>
    <p>Maladh (<span class="ar" dir="rtl" lang="ar">ملاذ</span>) vuol dire rifugio. Non conta i tuoi giorni e non ti ricorda nulla: resta qui, per quando ne senti il bisogno.</p>

    <label class="spunta" for="opt-suono">
      <input type="checkbox" id="opt-suono">
      <span>Suono del tocco nel Tasbih</span>
    </label>

    <h3>Le tue registrazioni</h3>
    <p class="nota" id="pk-stato" role="status" aria-live="polite"></p>
    <p class="nota" id="pk-cartelle" hidden></p>
    <div class="barra-carico" id="pk-barra" hidden role="progressbar" aria-label="Caricamento delle registrazioni" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="pk-barra-i"></span></div>
    <p class="nota" id="pk-msg" role="status" aria-live="polite"></p>
    <div class="sheet-azioni">
      <button class="btn" id="pk-carica" type="button">Carica un pacchetto .zip</button>
      <button class="btn secondario" id="pk-togli" type="button">Togli le registrazioni</button>
    </div>
    <input type="file" id="pk-file" accept=".zip,application/zip" hidden>
    <p class="nota">Le registrazioni restano solo in questo telefono. Niente viene inviato fuori.</p>

    <p class="versione" id="app-versione"></p>
    <div class="sheet-azioni"><button class="btn" id="sheet-chiudi" type="button">Chiudi</button></div>
  </div>
</div>

<script src="js/frasi_dati.js"></script>
<script src="js/frasi_it.js"></script>
<script src="js/tasbih.js"></script>
<script src="js/awrad.js"></script>
<script src="js/santuario.js"></script>
<script src="js/app.js"></script>
</body>
</html>
